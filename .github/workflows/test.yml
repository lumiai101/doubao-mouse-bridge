name: Test

# 默认使用本地验证，GitHub Actions 仅保留手动入口。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -B -I -m unittest discover -s tests -p "test_*.py" -v
      - name: Check release files
        run: python -B -I scripts/check_release.py
